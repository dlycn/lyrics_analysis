<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ov</title>
<link rel="stylesheet" href="../css/overlay-state.css">
</head>
<body>
  <!-- 全屏特效画布:WGSL 说了算 -->
  <main class="ov-stage" aria-hidden="true">
    <canvas id="fx" class="ov-stage__canvas"></canvas>
  </main>

  <!-- 右上角状态卡:HTML 层兜底 -->
  <section class="ov-hud" id="ov-hud" data-status="offline">
    <button type="button" class="ov-hud__avatar" id="ov-avatar" aria-label="小鲸鱼">
      <span class="ov-hud__halo" aria-hidden="true"></span>
    </button>
    <div class="ov-hud__meta">
      <span class="ov-hud__name">小鲸鱼</span>
      <span class="ov-hud__status" id="ov-status" aria-live="polite">离线</span>
      <span class="ov-hud__pulse" aria-hidden="true"></span>
    </div>
  </section>
  <script type="module" src="../js/gl.modify.js"></script>
  <script type="module" src="../js/overlay.hud.js"></script>
  <script type="module" src="../js/overlay.runtime.js"></script>
</body>
</html>
