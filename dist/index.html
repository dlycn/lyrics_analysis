<!DOCTYPE html>
<html>
    <head>
        <title>abclyrics studio</title>
        <meta charset="utf-8">
    </head>
    <body>
        <div id="abc-area">
            <div id="abc-editor">
                <textarea id="abc-input" placeholder="输入 ABC 指令"></textarea>
            </div>
            <div id="abc-viewer">
                <div id="abc-render"></div>
                <div id="abc-audio">
                    <button id="abc-play" type="button">▶ 播放</button>
                    <button id="abc-stop" type="button">■ 停止</button>
                    <span id="abc-play-state"></span>
                </div>
            </div>
        </div>
    </body>

    <script type="text/javascript" src="lib/abcjs-basic-min.js"></script>
    <script type="text/javascript" src="lib/midi.min.js"></script>    
    <script type="text/javascript" src="js/abc.runtime.js"></script>
</html>
